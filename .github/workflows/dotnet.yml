# Build and pack via Nuke (WPF requires Windows runners).

name: .NET

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: "preview"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run CI targets via Nuke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project "build/_build.csproj" -- --target Ci --configuration Release 2>&1 | Tee-Object -FilePath ci.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./TestResults/**/*.trx

      - name: Upload CI log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-log
          path: ./ci.log
          if-no-files-found: warn

      - name: Write CI summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## CI Run Summary

          - Workflow: ``$env:GITHUB_WORKFLOW``
          - Branch/Ref: ``$env:GITHUB_REF``
          - Actor: ``$env:GITHUB_ACTOR``
          - Job status: ``${{ job.status }}``

          ### Artifacts

          - ``test-results`` (TRX)
          - ``ci-log`` (Nuke / CLI output)
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
